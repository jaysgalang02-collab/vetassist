name: vetassist
description: "VetAssist login"
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk:  ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter

  google_sign_in: ^6.2.1
  firebase_auth: ^5.3.1
  firebase_core: ^3.5.0
  cupertino_icons: ^1.0.8
  cloud_firestore: ^5.4.2
  image_picker: ^1.2.0
  url_launcher: ^6.3.1

dev_dependencies:
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1


  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true


flutter:

  uses-material-design: true
  assets:
    - lib/assets/logo.png
    - lib/assets/symptom_model.json
    - lib/assets/clinical_reference.json
